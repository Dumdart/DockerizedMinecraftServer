services:
  minecraft:
    build:
      context: .
      dockerfile: Dockerfile
    image: mc-server:latest
    env_file:
      - .env
    volumes:
      - ./data:/data
    ports:
      - "25565:25565"
    healthcheck:
      test: ["CMD", "/usr/local/bin/minecraft-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 3
